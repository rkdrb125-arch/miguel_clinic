<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIGUEL CLINIC</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#423c43;background:#e9e0d8}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}#app{max-width:1080px;margin:auto;min-height:100vh;background:#faf5ec;box-shadow:0 0 45px #7a66542e}.top{display:flex;justify-content:space-between;gap:10px;padding:18px 24px;background:#544956;color:#fff;align-items:center;flex-wrap:wrap}.top b{letter-spacing:3px}.top small{color:#e7d9e3}.top button{border:1px solid #ffffff65;background:transparent;color:white;border-radius:9px;padding:7px 12px}.scene{position:relative;min-height:350px;overflow:hidden;background:linear-gradient(#b4d7dc 0 48%,#eee1c8 48% 100%);display:flex;align-items:flex-end;padding:30px}.scene:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 75% 17%,#fff4ba 0 5%,transparent 5.3%),linear-gradient(150deg,transparent 53%,#dfcdb0 53% 66%,transparent 66%);opacity:.8}.hills{position:absolute;bottom:0;left:-10%;width:120%;height:45%;background:#c6b08c;clip-path:polygon(0 64%,12% 45%,28% 59%,44% 33%,63% 60%,81% 32%,100% 56%,100% 100%,0 100%)}.buildings{position:absolute;bottom:0;left:5%;right:5%;height:46%;display:flex;align-items:flex-end;justify-content:space-around;gap:10px}.house{width:22%;height:65%;background:#a67c68;border:5px solid #8a6d60;border-bottom:0;position:relative;box-shadow:inset 0 16px #cda48b}.house:before{content:'';position:absolute;top:-21px;left:-10%;width:120%;height:22px;background:#766c70;transform:skew(-14deg)}.house:nth-child(2){height:92%;background:#e1c5a7}.house:nth-child(3){height:55%;background:#b6a6a0}.house:nth-child(4){height:78%;background:#b58c79}.house:after{content:'';position:absolute;bottom:0;left:40%;width:25%;height:53%;background:#655953;border:3px solid #f2dcc3;border-bottom:0}.sign{position:absolute;bottom:30px;left:32%;padding:8px 15px;background:#fff9e7;border:3px solid #6c7770;transform:rotate(-2deg);font-weight:900;letter-spacing:2px}.scene-title{position:relative;z-index:2;background:#ffffffdd;padding:10px 17px;border-radius:12px;box-shadow:0 5px 25px #0002;font-weight:700}.body{padding:24px;display:grid;grid-template-columns:1fr 250px;gap:24px}.panel{background:white;border:1px solid #e9ded4;border-radius:16px;padding:22px;box-shadow:0 4px 20px #55443a0a}.speaker{color:#8b647e;font-weight:800;margin-bottom:12px}.dialogue{font-size:17px;line-height:1.9;white-space:pre-line;min-height:90px}.choices{display:grid;gap:9px;margin-top:18px}.choices button,.primary{background:#f5eaf0;border:1px solid #d9bccc;border-radius:10px;text-align:left;padding:13px 16px;color:#51404b}.choices button:hover,.primary:hover{background:#e9d4df}.stats{display:grid;gap:14px}.meter{height:8px;background:#eee6e6;border-radius:20px;overflow:hidden;margin-top:6px}.meter span{display:block;height:100%;background:#b58aa3}.sidebar h3{margin:0 0 15px}.foot{padding:10px 24px 28px;color:#82757c;font-size:12px}.pill{display:inline-block;padding:5px 10px;background:#f0e7df;border-radius:20px;margin:0 5px 6px 0;font-size:12px}.ending{font-weight:800;color:#8b647e}@media(max-width:680px){.body{grid-template-columns:1fr;padding:14px;gap:12px}.scene{min-height:260px}.top{padding:14px}.panel{padding:17px}.dialogue{font-size:15px}}
</style></head><body><div id="app"><header class="top"><div><b>MIGUEL CLINIC</b><br><small>하얀 사막 끝의 작은 진료소</small></div><div><span id="clock">봄 · 첫날</span> <button onclick="save()">저장</button> <button onclick="restart()">처음부터</button></div></header><div class="scene"><div class="hills"></div><div class="buildings"><div class="house"></div><div class="house"></div><div class="house"></div><div class="house"></div></div><div class="sign">무료 진료소</div><div class="scene-title" id="place">백사구 외곽 정착촌</div></div><main class="body"><section class="panel"><div class="speaker" id="speaker"></div><div class="dialogue" id="dialogue"></div><div class="choices" id="choices"></div></section><aside class="panel sidebar"><h3>진료소 수첩</h3><div class="stats"><div>안정감 <span id="peaceN"></span><div class="meter"><span id="peace"></span></div></div><div>피로도 <span id="tiredN"></span><div class="meter"><span id="tired"></span></div></div><div>마을 신뢰 <span id="trustN"></span><div class="meter"><span id="trust"></span></div></div></div><hr style="border:0;border-top:1px solid #eee;margin:22px 0"><div id="notes"></div></aside></main><footer class="foot">팬 프로젝트용 독립 게임 확장 설정 · v0.1 · 모든 진행은 브라우저에 저장됩니다.</footer></div><script>
const KEY='miguel_clinic_v01';let state={node:'start',peace:55,tired:10,trust:0,notes:[],time:'첫날 · 오전'};const $=id=>document.getElementById(id);const scenes={
start:{who:'내레이션',place:'백사구 외곽 정착촌',text:'미겔 코트리먼은 살아남았다.\n\n제5사관학교와 제로 전담반을 거쳐, 그녀는 마침내 자신이 선택한 곳에 도착했다.\n\n하얀 먼지가 낡은 버스의 바퀴 뒤로 흩어진다.',choices:[['마을을 둘러본다','arrival']]},
arrival:{who:'미겔',place:'마을 입구',text:'“…….”\n\n물통 하나를 두고 다투는 주민들, 모래바람에 펄럭이는 천막, 먼지 쌓인 간판.\n\n“나쁘지 않다.”',choices:[['진료소 열쇠를 꺼낸다','clinic']]},
clinic:{who:'내레이션',place:'작은 무료 진료소',text:'문이 삐걱 소리를 내며 열린다. 낡은 진료대, 빈 선반, 깨끗하게 닦으면 쓸 만한 창문.\n\n미겔이 가방을 내려놓자마자 밖에서 비명이 들린다.',choices:[['문을 열어 본다','patient']]},
patient:{who:'호들갑스러운 주민',place:'진료소 · 첫 방문자',text:'“선생님!! 우리 아버지가 죽어가요!!”\n\n미겔은 곧장 일어섰다.\n\n“어제부터 제가 만든 요리를 안 드세요!”',choices:[['의식과 호흡 상태를 묻는다','check'],['요리를 보여 달라고 한다','food'],['아버지를 직접 데려오라고 한다','bring']]},
check:{who:'미겔',place:'진료소',text:'“의식은? 호흡은 정상인가?”\n\n“아주 멀쩡하세요! 아까 저한테 잔소리도 하셨어요!”\n\n“……그러면 우선 아버지를 직접 확인하겠다.”',choices:[['환자 본인을 확인한다','father']]},
food:{who:'미겔',place:'진료소',text:'“요리를 보여라.”\n\n주민이 꺼낸 그릇에는 정체를 알 수 없는 보랏빛 덩어리가 담겨 있다.\n\n“……아버지는 지금 어디에 있지?”',choices:[['환자 본인을 확인한다','father']]},
bring:{who:'미겔',place:'진료소',text:'“증상은 본인에게 확인해야 한다. 아버지를 모셔 와라.”\n\n“네! 금방 올게요!”\n\n주민은 요란한 발소리를 남기고 사라졌다.',choices:[['기다린다','father']]},
father:{who:'아버지',place:'진료소 · 첫 진료',text:'멀쩡하게 걸어 들어온 노인이 한숨을 쉰다.\n\n“선생, 난 아픈 데 없어. 저 녀석이 요리를 못하는 게 문제지.”\n\n미겔은 두 사람의 상태를 차분히 확인하고, 특별한 이상이 없음을 확인한다.',choices:[['식사와 건강 상태를 안내한다','afterfun',{trust:8,tired:5,notes:'첫 진료: 요리 소동'}]]},
afterfun:{who:'내레이션',place:'진료소 · 오후',text:'두 사람이 투닥거리며 돌아갔다. 진료소가 잠시 조용해졌다.\n\n그때 작은 노크 소리가 들린다. 문 앞에는 손바닥을 천으로 감싼 아이가 서 있다.',choices:[['아이를 맞이한다','child']]},
child:{who:'어린 환자',place:'진료소 · 오후',text:'“넘어졌어요. 엄마가 일하러 가셔서…… 혼자 왔어요.”\n\n천 아래에는 흙이 묻은 작은 찰과상이 보인다. 아이는 울음을 참으려 입술을 깨문다.',choices:[['상처를 살피고 깨끗이 처치한다','treat',{trust:12,tired:10}],['아이를 먼저 안심시키고 상처를 살핀다','comfort',{peace:5,trust:12,tired:10}]]},
treat:{who:'미겔',place:'진료소 · 오후',text:'“따끔할 수 있다. 움직이지 않는다.”\n\n미겔은 상처를 씻고 상태를 확인한 뒤 적절히 보호한다. 더 심해지면 다시 오라고 설명한다.\n\n아이는 작은 목소리로 고맙다고 말한다.',choices:[['하루를 마무리한다','evening',{notes:'두 번째 진료: 아이의 상처'}]]},
comfort:{who:'미겔',place:'진료소 · 오후',text:'“여기까지 잘 왔다. 이제 상처를 보겠다.”\n\n미겔은 아이가 진정할 시간을 주고 상처를 씻어 보호한다.\n\n아이는 나가면서 문을 다시 열고 손을 흔든다.',choices:[['하루를 마무리한다','evening',{notes:'두 번째 진료: 아이의 상처'}]]},
evening:{who:'내레이션',place:'진료소 · 저녁',text:'문을 닫자, 작은 마을의 불빛이 하나둘 켜진다.\n\n오늘 만난 사람들은 이상하고 시끄럽고, 또 제법 다정했다.\n\n책상 위의 통신기가 짧게 울린다.',choices:[['통신기를 확인한다','daniel']]},
daniel:{who:'다니엘 · 통신',place:'진료소 · 밤',text:'“코트리먼. 도착은 무사히 하셨습니까?”\n\n익숙한 목소리가 들린다. 멀리 떨어져 있지만, 여전히 자신의 자리를 지키고 있는 사람의 목소리다.',choices:[['“그렇다. 오늘 환자가 둘 왔다.”','answer1',{peace:8}],['“D. 이곳은 꽤 시끄럽다.”','answer2',{peace:5}]]},
answer1:{who:'다니엘 · 통신',place:'진료소 · 밤',text:'“벌써 두 분이나요? 첫날부터 바쁘셨군요.”\n\n미겔은 잠시 창밖을 본다.\n\n“나쁘지 않았다.”',choices:[['첫날을 끝낸다','end']]},
answer2:{who:'다니엘 · 통신',place:'진료소 · 밤',text:'“하하, 그렇습니까? 코트리먼께서 계신 곳이니 곧 익숙해지실 겁니다.”\n\n“그럴지도 모른다.”\n\n바람이 창문을 가볍게 두드린다.',choices:[['첫날을 끝낸다','end']]},
end:{who:'DAY 01 COMPLETE',place:'진료소 · 밤',text:'첫날이 끝났습니다.\n\n미겔은 누군가를 돌봤고, 조금 웃었고, 익숙한 목소리를 들었습니다.\n\n이번에는 자신이 선택한 방식으로.\n\n— v0.1 프롤로그 완료 —',choices:[['첫날 다시 플레이','start']]}
};
function advance(id,delta={}){if(delta.peace)state.peace=Math.max(0,Math.min(100,state.peace+delta.peace));if(delta.tired)state.tired=Math.max(0,Math.min(100,state.tired+delta.tired));if(delta.trust)state.trust=Math.max(0,Math.min(100,state.trust+delta.trust));if(delta.notes&&!state.notes.includes(delta.notes))state.notes.push(delta.notes);state.node=id;state.time=['afterfun','child','treat','comfort'].includes(id)?'첫날 · 오후':['evening'].includes(id)?'첫날 · 저녁':['daniel','answer1','answer2','end'].includes(id)?'첫날 · 밤':'첫날 · 오전';save(false);render()}
function render(){const s=scenes[state.node]||scenes.start;$('speaker').textContent=s.who;$('dialogue').textContent=s.text;$('place').textContent=s.place;$('clock').textContent=state.time;$('choices').innerHTML='';s.choices.forEach(([label,id,delta])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>advance(id,delta);$('choices').appendChild(b)});for(const [name,key] of [['peace','peace'],['tired','tired'],['trust','trust']]){$(name).style.width=state[key]+'%';$(name+'N').textContent=state[key]+'/100'}$('notes').innerHTML='<strong>진료 기록</strong><div style="margin-top:10px">'+(state.notes.length?state.notes.map(n=>'<span class="pill">'+n+'</span>').join(''):'<small>아직 기록이 없습니다.</small>')+'</div>'}
function save(show=true){localStorage.setItem(KEY,JSON.stringify(state));if(show)alert('현재 진행이 저장되었습니다.')}function restart(){if(confirm('처음부터 다시 시작할까요?')){state={node:'start',peace:55,tired:10,trust:0,notes:[],time:'첫날 · 오전'};save(false);render()}}try{const stored=JSON.parse(localStorage.getItem(KEY));if(stored&&scenes[stored.node])state=stored}catch(e){}render();
</script></body></html>
