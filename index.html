<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>MIGUEL CLINIC v1</title><style>:root{font-family:system-ui,sans-serif;color:#35443e;background:#eaf3ed}*{box-sizing:border-box}body{margin:0}main{max-width:840px;margin:auto;padding:16px}header,.panel{background:#fff;border:2px solid #bfd8c8;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 5px 0 #d4e5da}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:24px;color:#327b61}h2{font-size:19px}.muted{color:#70857a;font-size:13px}.stats{font-weight:700;text-align:right}.room{height:300px;position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(#f6f5e8 0 73%,#d9bda4 73%);border:2px solid #c5d3c9}.window{position:absolute;top:24px;left:28px;width:120px;height:105px;background:#bfe2eb;border:9px solid #f8ffff;border-radius:8px}.window:after{content:'+';position:absolute;left:42px;top:15px;font-size:50px;color:#7cb3b2}.shelf{position:absolute;right:20px;top:45px;font-size:44px}.patient{position:absolute;left:50%;top:58px;transform:translateX(-50%);font-size:110px;user-select:none}.bed{position:absolute;bottom:18px;left:12%;width:76%;height:66px;background:#a9cfc5;border:10px solid #f5faf6;border-radius:30px}.target{position:absolute;left:50%;top:153px;transform:translateX(-50%);width:105px;height:85px;border:3px dashed #f5a663;border-radius:50%;display:none;align-items:center;justify-content:center;color:#8d5b2f;background:#fff9e0a8;font-size:13px;font-weight:bold;pointer-events:none}.target.show{display:flex}.tools{display:flex;flex-wrap:wrap;gap:10px}.tool{touch-action:none;user-select:none;cursor:grab;background:#eaf5ee;border:2px solid #9ecbb2;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:700}.tool:disabled{opacity:.45;cursor:not-allowed}.tool.active{background:#fff2d6;border-color:#f2ad53}.actions{display:flex;gap:10px;flex-wrap:wrap}button.action{background:#397e65;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:bold;cursor:pointer}button.action:disabled{opacity:.4}.message{min-height:58px;line-height:1.6}.progress{height:12px;background:#dce7df;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#5eaf89;width:0%;transition:width .2s}footer{text-align:center;color:#70857a;font-size:12px;padding:12px}</style></head><body><main><header><div><h1>🩺 MIGUEL CLINIC</h1><div class="muted">동네 의원 · 직접 진찰 게임 v1</div></div><div class="stats">📅 DAY <span id="day">1</span><br>💰 <span id="money">0</span>원<br>⭐ <span id="score">0</span></div></header><section class="panel"><h2 id="name">오늘의 환자</h2><p id="speech" class="message" aria-live="polite"></p><div class="room" id="room"><div class="window"></div><div class="shelf">🪴<br>🗄️</div><div class="bed"></div><div class="patient" id="patient">🧑</div><div class="target" id="target">여기에 놓기</div></div></section><section class="panel"><h2>진찰 도구</h2><p class="muted">도구를 선택한 뒤 환자의 표시된 부위로 드래그하거나, 도구를 선택하고 표시를 터치하세요.</p><div class="tools" id="tools"></div><p id="hint" class="message"></p><div class="progress"><div id="progress"></div></div></section><section class="panel"><div class="actions"><button class="action" id="next" disabled>다음 환자 →</button><button class="action" id="reset">저장 데이터 초기화</button></div></section><footer>독립 웹게임 · 자동 저장 · PC / 모바일 터치 지원 · 게임용 단순화된 의료 표현</footer></main><script>
(()=>{'use strict';const KEY='miguel-clinic-v1';const patients=[{name:'동네 주민 하나',face:'👩',speech:'몸이 으슬으슬하고 열이 나는 것 같아요.',steps:[['🌡️','체온계','체온을 측정했어요. 38.1°C!'],['🩺','청진기','호흡음을 확인했어요. 진찰 완료!']]},{name:'산책 나온 준',face:'🧑',speech:'요즘 좀 어지러워서 혈압을 재고 싶어요.',steps:[['🩺','청진기','심장 소리를 확인했어요.'],['💗','혈압계','혈압을 측정했어요. 진찰 완료!']]},{name:'넘어진 주민',face:'👨',speech:'산책하다가 팔을 살짝 긁혔어요.',steps:[['🧼','소독솜','상처를 깨끗하게 닦았어요.'],['🩹','밴드','밴드를 붙였어요. 처치 완료!']]},{name:'기침하는 손님',face:'👩‍🦱',speech:'기침이 나서 진찰받으러 왔어요.',steps:[['🌡️','체온계','체온을 확인했어요.'],['🩺','청진기','호흡음을 확인했어요. 진찰 완료!']]}];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Number.isInteger(state.count))state={count:0,money:0,score:0,step:0};const $=id=>document.getElementById(id);let drag=null;function save(){localStorage.setItem(KEY,JSON.stringify(state))}function current(){return patients[state.count%patients.length]}function render(){const p=current(),done=state.step>=p.steps.length;$('day').textContent=1+Math.floor(state.count/4);$('money').textContent=state.money.toLocaleString('ko-KR');$('score').textContent=state.score;$('name').textContent=p.name;$('patient').textContent=p.face;$('speech').textContent=done?'진료가 끝났어요! 고맙습니다, 선생님!':`“${p.speech}”`;$('target').classList.toggle('show',!done);$('progress').style.width=(100*state.step/p.steps.length)+'%';$('hint').textContent=done?'✨ 진료 완료! 진료비 8,000원과 평판 1점을 획득했습니다.':`다음 단계: ${p.steps[state.step][1]}를 환자에게 사용해 주세요.`;$('next').disabled=!done;const tools=[['🌡️','체온계'],['🩺','청진기'],['💗','혈압계'],['🧼','소독솜'],['🩹','밴드']];$('tools').replaceChildren();tools.forEach(([emoji,name])=>{const b=document.createElement('button');b.className='tool';b.textContent=emoji+' '+name;b.disabled=done;b.dataset.name=name;b.addEventListener('pointerdown',e=>{if(done)return;drag=name;b.classList.add('active');b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',e=>{b.classList.remove('active');const rect=$('room').getBoundingClientRect();if(e.clientX>=rect.left&&e.clientX<=rect.right&&e.clientY>=rect.top&&e.clientY<=rect.bottom)use(name);else{selected=name;$('hint').textContent=`${name} 선택됨! 환자의 표시를 터치해 주세요.`}drag=null});$('tools').append(b)})}let selected=null;function use(name){if(!name)return;const p=current();if(state.step>=p.steps.length)return;if(name!==p.steps[state.step][1]){$('hint').textContent=`아직 ${name}을(를) 사용할 순 없어요. 다음 도구를 확인해 주세요.`;return}const result=p.steps[state.step][2];state.step++;selected=null;if(state.step===p.steps.length){state.money+=8000;state.score++}save();render();if(state.step<p.steps.length)$('hint').textContent=result+' 다음: '+p.steps[state.step][1];} $('target').addEventListener('pointerup',()=>use(selected));$('room').addEventListener('click',e=>{if(selected)use(selected)});$('next').addEventListener('click',()=>{if(state.step<current().steps.length)return;state.count++;state.step=0;save();render()});$('reset').addEventListener('click',()=>{if(confirm('진행 기록을 초기화할까요?')){localStorage.removeItem(KEY);state={count:0,money:0,score:0,step:0};render()}});render()})();
</script></body></html>
